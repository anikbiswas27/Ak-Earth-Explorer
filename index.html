<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Earth Explorer — Vector</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --glass:rgba(14,18,28,0.55);
  --glass-strong:rgba(14,18,28,0.78);
  --border:rgba(255,255,255,0.12);
  --cyan:#6ee7de;
  --amber:#f2a154;
  --text:#eef2f8;
  --muted:#93a0b4;
  --danger:#f26d6d;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;height:100%;background:#05070c;font-family:'Inter',sans-serif;color:var(--text);overflow:hidden;}
#map{position:absolute;inset:0;}
.maplibregl-ctrl-attrib{background:rgba(0,0,0,0.4)!important;color:#9aa6b8!important;border-radius:8px 0 0 0;}
.maplibregl-ctrl-attrib a{color:#cfd8e6!important;}
.maplibregl-ctrl-bottom-right{display:none;}
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:flex-start;justify-content:space-between;padding:20px 24px;gap:16px;pointer-events:none;}
.brand{display:flex;flex-direction:column;gap:4px;pointer-events:auto;}
.brand-title{font-family:'Sora',sans-serif;font-weight:800;font-size:19px;letter-spacing:0.04em;display:flex;align-items:center;gap:8px;text-transform:uppercase;}
.brand-title .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.brand-sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:0.03em;}
.search-wrap{flex:1;max-width:460px;position:relative;pointer-events:auto;}
.search-box{display:flex;align-items:center;gap:10px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:16px;padding:12px 16px;box-shadow:0 8px 28px rgba(0,0,0,0.35);}
.search-box svg{flex-shrink:0;opacity:0.6;}
.search-box input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;}
.search-box input::placeholder{color:var(--muted);}
.search-spinner{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,0.15);border-top-color:var(--cyan);animation:spin 0.7s linear infinite;display:none;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}
.search-results{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--glass-strong);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,0.45);max-height:340px;overflow-y:auto;display:none;}
.search-results.open{display:block;}
.result-item{padding:11px 16px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.06);transition:background 0.15s;}
.result-item:last-child{border-bottom:none;}
.result-item:hover,.result-item.active{background:rgba(110,231,222,0.1);}
.result-main{font-size:13.5px;font-weight:600;color:var(--text);}
.result-sub{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);margin-top:2px;}
.hud{display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:auto;}
.hud-coords{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:10px;padding:8px 12px;text-align:right;line-height:1.6;}
.hud-coords span{color:var(--cyan);}
.hud-zoom{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--amber);background:var(--glass);border:1px solid var(--border);border-radius:10px;padding:6px 12px;backdrop-filter:blur(14px);}
.zoom-tier{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:0.05em;text-transform:uppercase;}
.controls{position:fixed;right:20px;bottom:24px;z-index:20;display:flex;flex-direction:column;gap:10px;pointer-events:auto;}
.ctrl-btn{width:44px;height:44px;border-radius:13px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;transition:all 0.15s;box-shadow:0 6px 20px rgba(0,0,0,0.3);}
.ctrl-btn:hover{background:rgba(110,231,222,0.14);border-color:var(--cyan);transform:translateY(-1px);}
.ctrl-btn:active{transform:translateY(0);}
#panel{position:fixed;top:0;right:0;height:100%;width:400px;max-width:92vw;background:var(--glass-strong);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-left:1px solid var(--border);transform:translateX(100%);transition:transform 0.5s cubic-bezier(.2,.8,.2,1);z-index:30;display:flex;flex-direction:column;padding:24px 22px 30px;overflow-y:auto;box-shadow:-16px 0 40px rgba(0,0,0,0.4);}
#panel.open{transform:translateX(0);}
#panel::-webkit-scrollbar{width:6px;}
#panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:3px;}
.panel-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.panel-tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--cyan);letter-spacing:0.08em;text-transform:uppercase;border:1px solid rgba(110,231,222,0.35);padding:4px 10px;border-radius:20px;background:rgba(110,231,222,0.06);}
.close-btn{background:rgba(255,255,255,0.06);border:none;color:var(--muted);width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:16px;line-height:1;transition:all 0.15s;}
.close-btn:hover{color:var(--text);background:rgba(255,255,255,0.12);}
.panel-title{font-family:'Sora',sans-serif;font-weight:700;font-size:22px;line-height:1.25;margin:2px 0 4px;}
.panel-region{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:14px;}
.coord-readout{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:10px 0;display:flex;justify-content:space-between;margin-bottom:16px;}
.coord-readout b{color:var(--amber);font-weight:600;}
.hier-list{display:flex;flex-direction:column;gap:2px;margin-bottom:18px;}
.hier-row{display:flex;justify-content:space-between;padding:7px 10px;border-radius:8px;font-size:12.5px;}
.hier-row:nth-child(odd){background:rgba(255,255,255,0.03);}
.hier-label{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:0.04em;}
.hier-value{color:var(--text);font-weight:500;text-align:right;max-width:60%;}
.section-title{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--cyan);margin:18px 0 8px;display:flex;align-items:center;gap:8px;}
.section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(110,231,222,0.35),transparent);}
.poi-list{display:flex;flex-direction:column;gap:6px;}
.poi-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,0.03);border:1px solid transparent;transition:all 0.15s;cursor:pointer;}
.poi-item:hover{background:rgba(110,231,222,0.08);border-color:rgba(110,231,222,0.25);}
.poi-icon{font-size:16px;width:26px;text-align:center;flex-shrink:0;}
.poi-name{font-size:12.5px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.poi-dist{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--amber);flex-shrink:0;}
.poi-empty{font-size:11.5px;color:var(--muted);font-style:italic;padding:6px 10px;}
.scan-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 0;gap:14px;}
.radar{width:64px;height:64px;border-radius:50%;border:1px solid var(--border);position:relative;overflow:hidden;}
.radar::before{content:'';position:absolute;inset:0;background:conic-gradient(from 0deg,transparent 0deg,var(--cyan) 30deg,transparent 60deg);animation:sweep 1s linear infinite;}
.radar::after{content:'';position:absolute;inset:7px;border-radius:50%;background:var(--glass-strong);border:1px solid var(--border);}
@keyframes sweep{to{transform:rotate(360deg);}}
.scan-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;}
.click-marker{width:18px;height:18px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px rgba(242,161,84,0.25);position:relative;}
.click-marker::after{content:'';position:absolute;inset:-8px;border:2px solid var(--amber);border-radius:50%;animation:markerPulse 1.5s infinite;}
@keyframes markerPulse{0%{transform:scale(0.6);opacity:0.9;}100%{transform:scale(2.1);opacity:0;}}
#hint{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);letter-spacing:0.04em;z-index:15;pointer-events:none;display:flex;align-items:center;gap:8px;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--border);padding:9px 16px;border-radius:20px;transition:opacity 0.6s;}
#hint .ring{width:8px;height:8px;border-radius:50%;border:1px solid var(--amber);animation:ring-pulse 1.6s infinite ease-out;}
@keyframes ring-pulse{0%{box-shadow:0 0 0 0 rgba(242,161,84,0.5);}100%{box-shadow:0 0 0 9px rgba(242,161,84,0);}}
@media (max-width:640px){
  .topbar{padding:14px;flex-wrap:wrap;}
  .search-wrap{order:3;max-width:none;flex-basis:100%;}
  #panel{width:100%;}
}
</style>
</head>
<body>

<div id="map"></div>

<div class="topbar">
  <div class="brand">
    <div class="brand-title"><span class="dot"></span>Earth Explorer- By Anik Biswas</div>
    <div class="brand-sub">VECTOR · OPENSTREETMAP</div>
  </div>
  <div class="search-wrap">
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="Search places, cities, addresses…" autocomplete="off"/>
      <div class="search-spinner" id="searchSpinner"></div>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>
  <div class="hud">
    <div class="hud-coords" id="hudCoords">LAT <span>--.----</span><br/>LON <span>--.----</span></div>
    <div class="hud-zoom" id="hudZoom">ZOOM --</div>
    <div class="zoom-tier" id="zoomTier"></div>
  </div>
</div>

<div class="controls">
  <div class="ctrl-btn" id="zoomInBtn" title="Zoom in">+</div>
  <div class="ctrl-btn" id="zoomOutBtn" title="Zoom out">−</div>
  <div class="ctrl-btn" id="locateBtn" title="My location">◎</div>
  <div class="ctrl-btn" id="tiltBtn" title="Toggle 3D">▲</div>
</div>

<div id="hint"><span class="ring"></span>CLICK ANYWHERE TO EXPLORE</div>

<div id="panel">
  <div class="panel-top">
    <div class="panel-tag" id="panelTag">LOCATION</div>
    <button class="close-btn" id="closeBtn">✕</button>
  </div>
  <div class="panel-title" id="panelTitle">—</div>
  <div class="panel-region" id="panelRegion"></div>
  <div class="coord-readout">
    <span>LAT <b id="rLat">0.0000</b></span>
    <span>LON <b id="rLon">0.0000</b></span>
  </div>
  <div id="panelBody"></div>
</div>

<script>
const ZOOM_TIERS = [
  {min:0,max:2.5,label:'Earth'},
  {min:2.5,max:4,label:'Continents'},
  {min:4,max:6,label:'Countries'},
  {min:6,max:8,label:'States'},
  {min:8,max:10,label:'Districts'},
  {min:10,max:11.5,label:'Cities'},
  {min:11.5,max:13,label:'Localities'},
  {min:13,max:15,label:'Roads'},
  {min:15,max:16.5,label:'Street Names'},
  {min:16.5,max:19,label:'Buildings'},
  {min:19,max:24,label:'Maximum Detail'}
];

const map = new maplibregl.Map({
  container:'map',
  style:'https://tiles.openfreemap.org/styles/liberty',
  center:[0,20],
  zoom:2.2,
  pitch:0,
  bearing:0,
  antialias:true,
  attributionControl:{compact:true}
});
map.dragRotate.enable();
map.touchZoomRotate.enableRotation();

const hudCoords = document.getElementById('hudCoords');
const hudZoom = document.getElementById('hudZoom');
const zoomTier = document.getElementById('zoomTier');
const hint = document.getElementById('hint');
const panel = document.getElementById('panel');
const panelBody = document.getElementById('panelBody');
const panelTag = document.getElementById('panelTag');
const panelTitle = document.getElementById('panelTitle');
const panelRegion = document.getElementById('panelRegion');
const rLat = document.getElementById('rLat');
const rLon = document.getElementById('rLon');

function tierForZoom(z){
  for(const t of ZOOM_TIERS){ if(z>=t.min && z<t.max) return t.label; }
  return 'Maximum Detail';
}
function updateHud(){
  const c = map.getCenter();
  hudCoords.innerHTML = `LAT <span>${c.lat.toFixed(4)}</span><br/>LON <span>${c.lng.toFixed(4)}</span>`;
  const z = map.getZoom();
  hudZoom.textContent = 'ZOOM ' + z.toFixed(2);
  zoomTier.textContent = tierForZoom(z);
}
map.on('move', updateHud);
map.on('load', updateHud);

let currentMarker = null;
function placeMarker(lng,lat){
  if(currentMarker) currentMarker.remove();
  const el = document.createElement('div');
  el.className = 'click-marker';
  currentMarker = new maplibregl.Marker({element:el}).setLngLat([lng,lat]).addTo(map);
}

document.getElementById('zoomInBtn').onclick = ()=> map.flyTo({zoom:map.getZoom()+1,duration:600});
document.getElementById('zoomOutBtn').onclick = ()=> map.flyTo({zoom:map.getZoom()-1,duration:600});
let is3D = false;
document.getElementById('tiltBtn').onclick = ()=>{
  is3D = !is3D;
  map.easeTo({pitch:is3D?55:0,duration:700});
};
document.getElementById('locateBtn').onclick = ()=>{
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude,longitude} = pos.coords;
    map.flyTo({center:[longitude,latitude],zoom:15,duration:1400,essential:true});
    placeMarker(longitude,latitude);
    inspectLocation(latitude,longitude);
  });
};
document.getElementById('closeBtn').onclick = ()=> panel.classList.remove('open');

function haversine(lat1,lon1,lat2,lon2){
  const R=6371000;
  const toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1);
  const dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function fmtDist(m){
  return m<1000 ? Math.round(m)+' m' : (m/1000).toFixed(1)+' km';
}

async function reverseGeocode(lat,lon){
  const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`,{headers:{'Accept-Language':'en'}});
  if(!res.ok) throw new Error('reverse failed');
  return res.json();
}

const POI_CATS = [
  {key:'restaurant',label:'Restaurants',icon:'🍽️',query:'node["amenity"="restaurant"]',radius:1500},
  {key:'hospital',label:'Hospitals',icon:'🏥',query:'node["amenity"="hospital"]',radius:3500},
  {key:'school',label:'Schools',icon:'🏫',query:'node["amenity"="school"]',radius:1500},
  {key:'mall',label:'Shopping Malls',icon:'🛍️',query:'node["shop"="mall"]',radius:4000},
  {key:'railway',label:'Railway Stations',icon:'🚉',query:'node["railway"="station"]',radius:6000},
  {key:'airport',label:'Airports',icon:'✈️',query:'node["aeroway"="aerodrome"]',radius:25000}
];

async function fetchNearbyPOIs(lat,lon){
  const parts = POI_CATS.map(c=>`${c.query}(around:${c.radius},${lat},${lon});`).join('');
  const q = `[out:json][timeout:20];(${parts});out center 60;`;
  const res = await fetch('https://overpass-api.de/api/interpreter',{
    method:'POST',
    body:'data='+encodeURIComponent(q)
  });
  if(!res.ok) throw new Error('overpass failed');
  const data = await res.json();
  const grouped = {};
  POI_CATS.forEach(c=>grouped[c.key]=[]);
  (data.elements||[]).forEach(el=>{
    const tags = el.tags||{};
    let cat = null;
    if(tags.amenity==='restaurant') cat='restaurant';
    else if(tags.amenity==='hospital') cat='hospital';
    else if(tags.amenity==='school') cat='school';
    else if(tags.shop==='mall') cat='mall';
    else if(tags.railway==='station') cat='railway';
    else if(tags.aeroway==='aerodrome') cat='airport';
    if(!cat) return;
    const plat = el.lat!==undefined?el.lat:(el.center?el.center.lat:null);
    const plon = el.lon!==undefined?el.lon:(el.center?el.center.lon:null);
    if(plat===null||plon===null) return;
    grouped[cat].push({
      name: tags.name || tags['name:en'] || 'Unnamed',
      dist: haversine(lat,lon,plat,plon),
      lat:plat, lon:plon
    });
  });
  Object.keys(grouped).forEach(k=>{
    grouped[k].sort((a,b)=>a.dist-b.dist);
    grouped[k] = grouped[k].slice(0,5);
  });
  return grouped;
}

function addrField(addr, keys){
  for(const k of keys){ if(addr[k]) return addr[k]; }
  return null;
}

function renderScanning(){
  panelBody.innerHTML = `<div class="scan-wrap"><div class="radar"></div><div class="scan-label">Resolving location…</div></div>`;
}

function renderResult(geo, pois, lat, lon){
  const addr = geo.address || {};
  const country = addr.country || '—';
  const countryCode = (addr.country_code||'').toUpperCase();
  const state = addr.state || addr.region || '—';
  const district = addrField(addr,['state_district','county','district']) || '—';
  const city = addrField(addr,['city','town','municipality']) || '—';
  const locality = addrField(addr,['suburb','neighbourhood','village','hamlet','quarter']) || '—';
  const road = addr.road || '—';
  const houseNo = addr.house_number || '';
  const postcode = addr.postcode || '—';

  const title = geo.name || addrField(addr,['building','amenity','road','suburb','city']) || country;
  const region = [state!=='—'?state:null, country!=='—'?country:null].filter(Boolean).join(', ');

  panelTag.textContent = countryCode ? countryCode + ' · LOCATION' : 'LOCATION';
  panelTitle.textContent = title;
  panelRegion.textContent = region;
  rLat.textContent = lat.toFixed(5);
  rLon.textContent = lon.toFixed(5);

  const hierRows = [
    ['Country', country],
    ['State', state],
    ['District', district],
    ['City', city],
    ['Locality', locality],
    ['Street', houseNo ? houseNo+' '+road : road],
    ['Postal Code', postcode]
  ].map(([label,val])=>`<div class="hier-row"><span class="hier-label">${label}</span><span class="hier-value">${val}</span></div>`).join('');

  let poiHtml = '';
  POI_CATS.forEach(cat=>{
    const list = pois[cat.key] || [];
    poiHtml += `<div class="section-title">${cat.icon} ${cat.label}</div><div class="poi-list">`;
    if(list.length===0){
      poiHtml += `<div class="poi-empty">None found nearby</div>`;
    } else {
      list.forEach(p=>{
        poiHtml += `<div class="poi-item" data-lat="${p.lat}" data-lon="${p.lon}">
          <span class="poi-icon">${cat.icon}</span>
          <span class="poi-name">${p.name}</span>
          <span class="poi-dist">${fmtDist(p.dist)}</span>
        </div>`;
      });
    }
    poiHtml += `</div>`;
  });

  panelBody.innerHTML = `<div class="hier-list">${hierRows}</div>${poiHtml}`;

  panelBody.querySelectorAll('.poi-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const plat = parseFloat(el.dataset.lat);
      const plon = parseFloat(el.dataset.lon);
      map.flyTo({center:[plon,plat],zoom:17,duration:1200});
      placeMarker(plon,plat);
    });
  });
}

function renderError(){
  panelTag.textContent = 'ERROR';
  panelTitle.textContent = 'Lookup failed';
  panelRegion.textContent = '';
  panelBody.innerHTML = `<div class="poi-empty">Could not reach geocoding services. Try clicking again.</div>`;
}

async function inspectLocation(lat, lon){
  hint.style.opacity = '0';
  panel.classList.add('open');
  panelTag.textContent = 'SCANNING';
  panelTitle.textContent = '—';
  panelRegion.textContent = '';
  rLat.textContent = lat.toFixed(5);
  rLon.textContent = lon.toFixed(5);
  renderScanning();
  try{
    const [geo, pois] = await Promise.all([
      reverseGeocode(lat,lon).catch(()=>null),
      fetchNearbyPOIs(lat,lon).catch(()=>({}))
    ]);
    if(!geo){ renderError(); return; }
    renderResult(geo, pois, lat, lon);
  }catch(err){
    renderError();
  }
}

map.on('click', (e)=>{
  const {lng,lat} = e.lngLat;
  placeMarker(lng,lat);
  map.flyTo({center:[lng,lat],zoom:Math.max(map.getZoom(),14),duration:1100,essential:true});
  inspectLocation(lat,lng);
});

const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
const searchSpinner = document.getElementById('searchSpinner');
let searchDebounce = null;
let searchAbort = null;
let activeIndex = -1;
let currentResults = [];

async function performSearch(q){
  if(searchAbort) searchAbort.abort();
  searchAbort = new AbortController();
  searchSpinner.style.display = 'block';
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(q)}&addressdetails=1&limit=7`,{
      signal:searchAbort.signal,
      headers:{'Accept-Language':'en'}
    });
    const data = await res.json();
    currentResults = data;
    activeIndex = -1;
    renderSearchResults(data);
  }catch(err){
    if(err.name!=='AbortError'){ searchResults.innerHTML=''; searchResults.classList.remove('open'); }
  }finally{
    searchSpinner.style.display = 'none';
  }
}

function renderSearchResults(list){
  if(!list.length){
    searchResults.innerHTML = `<div class="poi-empty" style="padding:14px 16px;">No results</div>`;
    searchResults.classList.add('open');
    return;
  }
  searchResults.innerHTML = list.map((item,i)=>{
    const main = item.name || item.display_name.split(',')[0];
    const sub = item.display_name;
    return `<div class="result-item" data-idx="${i}"><div class="result-main">${main}</div><div class="result-sub">${sub}</div></div>`;
  }).join('');
  searchResults.classList.add('open');
  searchResults.querySelectorAll('.result-item').forEach(el=>{
    el.addEventListener('click', ()=>selectResult(parseInt(el.dataset.idx)));
  });
}

function selectResult(idx){
  const item = currentResults[idx];
  if(!item) return;
  const lat = parseFloat(item.lat);
  const lon = parseFloat(item.lon);
  searchResults.classList.remove('open');
  searchInput.value = item.display_name;
  let targetZoom = 12;
  if(item.type==='country') targetZoom = 4.5;
  else if(item.type==='state'||item.type==='administrative') targetZoom = 6.5;
  else if(item.type==='city'||item.type==='town') targetZoom = 11;
  else if(item.type==='village'||item.type==='suburb') targetZoom = 14;
  else if(item.class==='building') targetZoom = 18;
  map.flyTo({center:[lon,lat],zoom:targetZoom,duration:1800,essential:true});
  placeMarker(lon,lat);
  inspectLocation(lat,lon);
}

searchInput.addEventListener('input', ()=>{
  clearTimeout(searchDebounce);
  const q = searchInput.value.trim();
  if(q.length<3){ searchResults.classList.remove('open'); return; }
  searchDebounce = setTimeout(()=>performSearch(q), 320);
});
searchInput.addEventListener('keydown', (e)=>{
  const items = searchResults.querySelectorAll('.result-item');
  if(e.key==='ArrowDown'){
    e.preventDefault();
    activeIndex = Math.min(activeIndex+1, items.length-1);
    items.forEach((el,i)=>el.classList.toggle('active', i===activeIndex));
    items[activeIndex]?.scrollIntoView({block:'nearest'});
  } else if(e.key==='ArrowUp'){
    e.preventDefault();
    activeIndex = Math.max(activeIndex-1, 0);
    items.forEach((el,i)=>el.classList.toggle('active', i===activeIndex));
    items[activeIndex]?.scrollIntoView({block:'nearest'});
  } else if(e.key==='Enter'){
    if(activeIndex>=0) selectResult(activeIndex);
    else if(currentResults.length) selectResult(0);
  } else if(e.key==='Escape'){
    searchResults.classList.remove('open');
  }
});
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.search-wrap')) searchResults.classList.remove('open');
});
</script>
</body>
</html>
